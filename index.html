<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RecipeJS - Functional Cooking Companion</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>RecipeJS - Functional Cooking Companion</h1>
  </header>

  <!-- Controls -->
  <section id="controls">
    <div class="filter-buttons">
      <button data-filter="all" class="active">Show All</button>
      <button data-filter="easy">Easy</button>
      <button data-filter="medium">Medium</button>
      <button data-filter="hard">Hard</button>
      <button data-filter="quick">Quick Recipes (&lt;30 min)</button>
    </div>
    <div class="sort-buttons">
      <button data-sort="none" class="active">Default Order</button>
      <button data-sort="name">Name (A-Z)</button>
      <button data-sort="time">Time (Fastest First)</button>
    </div>
  </section>

  <!-- Recipes container -->
  <section id="recipe-container"></section>

  <script src="app.js"></script>
</body>
</html>
